      <text x="50" y="48" text-anchor="middle" font-size="28">📱</text>
      <text x="50" y="95" text-anchor="middle" font-family="Inter, Arial" font-size="16" font-weight="600" fill="#1e293b">Telefondan</text>
      <text x="50" y="115" text-anchor="middle" font-family="Inter, Arial" font-size="14" fill="#64748b">boshqaring</text>
    </g>
    
    <g transform="translate(340, 40)">
      <circle cx="50" cy="40" r="35" fill="#eff6ff"/>
      <text x="50" y="48" text-anchor="middle" font-size="28">📅</text>
      <text x="50" y="95" text-anchor="middle" font-family="Inter, Arial" font-size="16" font-weight="600" fill="#1e293b">Avtomatik</text>
      <text x="50" y="115" text-anchor="middle" font-family="Inter, Arial" font-size="14" fill="#64748b">jadval</text>
    </g>
    
    <g transform="translate(580, 40)">
      <circle cx="50" cy="40" r="35" fill="#eff6ff"/>
      <text x="50" y="48" text-anchor="middle" font-size="28">🔋</text>
      <text x="50" y="95" text-anchor="middle" font-family="Inter, Arial" font-size="16" font-weight="600" fill="#1e293b">Offline</text>
      <text x="50" y="115" text-anchor="middle" font-family="Inter, Arial" font-size="14" fill="#64748b">ishlaydi</text>
    </g>
    
    <g transform="translate(820, 40)">
      <circle cx="50" cy="40" r="35" fill="#eff6ff"/>
      <text x="50" y="48" text-anchor="middle" font-size="28">🔔</text>
      <text x="50" y="95" text-anchor="middle" font-family="Inter, Arial" font-size="16" font-weight="600" fill="#1e293b">Signal</text>
      <text x="50" y="115" text-anchor="middle" font-family="Inter, Arial" font-size="14" fill="#64748b">1 tugmada</text>
    </g>
  </g>

  <!-- Bottom section -->
  <g transform="translate(0, 800)">
    <!-- Key selling points -->
    <text x="540" y="40" text-anchor="middle" font-family="Inter, Arial" font-size="22" fill="#334155">💰 Oylik to'lov yo'q  •  ⏱ O'rnatish 5 daqiqa  •  📦 Kafolat 1 yil</text>
