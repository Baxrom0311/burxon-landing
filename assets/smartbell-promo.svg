  <rect x="0" y="920" width="1080" height="4" fill="#2864ef"/>
  <text x="540" y="980" text-anchor="middle" font-family="Inter, Arial" font-size="28" font-weight="700" fill="#ffffff">Baxrom</text>
  <text x="540" y="1030" text-anchor="middle" font-family="Inter, Arial" font-size="24" fill="#bcd9ff">📱 @bakhromdev   •   📞 +998 93 558 03 11</text>
  <text x="540" y="1065" text-anchor="middle" font-family="Inter, Arial" font-size="16" fill="#8ebfff">Telegram orqali yozing — bepul maslahat</text>
</svg>
