<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#ffffff"/>
  
  <!-- Top gradient accent -->
  <rect width="1080" height="6" fill="#2864ef"/>
  
  <!-- Brand name -->
  <text x="540" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#1d3c7a">🔔 SmartBell</text>
  <text x="540" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" fill="#64748b">Maktab qo'ng'iroqlarini avtomatlashtiring</text>

  <!-- Main illustration area -->
  <!-- Device (left side) -->
  <g transform="translate(200, 250)">
    <!-- ESP32 box -->
    <rect x="0" y="40" width="120" height="80" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="10" y="50" width="30" height="20" rx="3" fill="#1d3c7a"/>
    <circle cx="100" cy="60" r="5" fill="#22c55e"/>
    <text x="60" y="95" text-anchor="middle" font-family="Arial" font-size="11" fill="#475569">ESP32</text>
    <!-- Bell connected -->
    <path d="M140 60 L180 60" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4"/>
    <text x="220" y="55" text-anchor="middle" font-size="48">🔔</text>
    <text x="220" y="95" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Qo'ng'iroq</text>
  </g>

  <!-- WiFi connection arcs -->
  <g transform="translate(540, 320)">
    <path d="M-30 0 A30 30 0 0 1 30 0" fill="none" stroke="#2864ef" stroke-width="3" opacity="0.3"/>
    <path d="M-50 10 A50 50 0 0 1 50 10" fill="none" stroke="#2864ef" stroke-width="3" opacity="0.5"/>
    <path d="M-70 20 A70 70 0 0 1 70 20" fill="none" stroke="#2864ef" stroke-width="3" opacity="0.7"/>
    <circle cx="0" cy="5" r="5" fill="#2864ef"/>
  </g>

  <!-- Phone (right side) -->
  <g transform="translate(700, 240)">
    <rect x="0" y="0" width="140" height="250" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="8" y="30" width="124" height="190" rx="4" fill="#ffffff"/>
    <!-- Screen content - schedule -->
    <rect x="16" y="40" width="108" height="24" rx="4" fill="#2864ef" opacity="0.1"/>
    <text x="70" y="57" text-anchor="middle" font-family="Arial" font-size="11" font-weight="600" fill="#2864ef">Jadval</text>
    <!-- Schedule rows -->
    <rect x="16" y="72" width="108" height="20" rx="3" fill="#f1f5f9"/>
    <text x="24" y="86" font-family="Arial" font-size="10" fill="#334155">1-dars  08:00</text>
    <circle cx="112" cy="82" r="6" fill="#22c55e" opacity="0.8"/>
    
    <rect x="16" y="96" width="108" height="20" rx="3" fill="#f1f5f9"/>
    <text x="24" y="110" font-family="Arial" font-size="10" fill="#334155">2-dars  09:30</text>
    <circle cx="112" cy="106" r="6" fill="#22c55e" opacity="0.8"/>
    
    <rect x="16" y="120" width="108" height="20" rx="3" fill="#f1f5f9"/>
    <text x="24" y="134" font-family="Arial" font-size="10" fill="#334155">3-dars  11:00</text>
    <circle cx="112" cy="130" r="6" fill="#22c55e" opacity="0.8"/>

    <rect x="16" y="144" width="108" height="20" rx="3" fill="#f1f5f9"/>
    <text x="24" y="158" font-family="Arial" font-size="10" fill="#334155">4-dars  12:30</text>
    <circle cx="112" cy="154" r="6" fill="#22c55e" opacity="0.8"/>

    <!-- Sync button -->
    <rect x="16" y="176" width="108" height="28" rx="6" fill="#2864ef"/>
    <text x="70" y="195" text-anchor="middle" font-family="Arial" font-size="11" font-weight="600" fill="#ffffff">✓ Sinxronlangan</text>

    <!-- Phone notch -->
    <rect x="50" y="8" width="40" height="6" rx="3" fill="#334155"/>
  </g>

  <!-- Features section -->
  <g transform="translate(0, 560)">
    <rect x="40" y="0" width="1000" height="2" fill="#e2e8f0"/>
    
    <!-- 4 features -->
    <g transform="translate(100, 40)">
